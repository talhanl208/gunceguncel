<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="description" content="Alışkanlık, görev, hedef, abonelik ve döngü takibi için kişisel ajanda.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Günce">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html{-webkit-tap-highlight-color:transparent}</style>
<title>Günce Ajanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: two skins over one structure. "Yumuşak" is a dot-grid journal page; "Sert" is a black steel grid with flag-red orders. Desktop: sticky left spine; phones: bottom dock + floating add. A profile gate (Talha / Reyhan) sits in front of everything. */
:root{
  --paper:#F5F6FB; --dot:#D3D6E5; --card:#FFFFFF; --card-2:#F3F4FA; --sunk:#E8EAF3; --line:#E2E3EE;
  --ink:#1D1946; --ink-2:#55507E; --ink-3:#8C88AE;
  --acc:#E23E57; --on-acc:#FFFFFF;
  --task:#2F6FEB; --task-s:#E2EBFF;
  --habit:#129A5E; --habit-s:#D9F4E7;
  --goal:#7A55E8; --goal-s:#ECE5FF;
  --rem:#CC7605; --rem-s:#FFEFD4;
  --sub:#0A94A0; --sub-s:#D6F2F4;
  --event:#D2418A; --event-s:#FFE2EF;
  --red:#E5484D; --red-s:#FFE4E5;
  --cyc:#DB3F78; --cyc-s:#FFE0EB; --fert:#11A08A; --fert-s:#D3F4EE;
  --m1:#E5484D; --m2:#EE8434; --m3:#DDA80B; --m4:#38B26C; --m5:#2F86F0;
  --hl:#FFE27A; --tape:rgba(255,143,179,.62); --tape-2:rgba(116,195,255,.62);
  --shadow:0 1px 2px rgba(29,25,70,.05),0 10px 26px -14px rgba(29,25,70,.25);
  --shadow-lg:0 26px 60px -22px rgba(29,25,70,.38);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11112A; --dot:#262850; --card:#1A1B37; --card-2:#202245; --sunk:#2A2C52; --line:#2D2F55;
    --ink:#F2F1FF; --ink-2:#C4C1E9; --ink-3:#8B88B6;
    --task:#6F9CFF; --task-s:#1F2B58; --habit:#43D08F; --habit-s:#173B34; --goal:#A98DFF; --goal-s:#2D2559;
    --rem:#F5AA40; --rem-s:#3E2F1B; --sub:#37CDD9; --sub-s:#163B46; --event:#F37DB7; --event-s:#45203B;
    --red:#FF6B70; --red-s:#46202B; --cyc:#FF73A1; --cyc-s:#48192D; --fert:#3FD1B6; --fert-s:#123A33;
    --hl:rgba(255,214,80,.30); --tape:rgba(255,143,179,.38); --tape-2:rgba(116,195,255,.36);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.7); --shadow-lg:0 28px 60px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11112A; --dot:#262850; --card:#1A1B37; --card-2:#202245; --sunk:#2A2C52; --line:#2D2F55;
  --ink:#F2F1FF; --ink-2:#C4C1E9; --ink-3:#8B88B6;
  --task:#6F9CFF; --task-s:#1F2B58; --habit:#43D08F; --habit-s:#173B34; --goal:#A98DFF; --goal-s:#2D2559;
  --rem:#F5AA40; --rem-s:#3E2F1B; --sub:#37CDD9; --sub-s:#163B46; --event:#F37DB7; --event-s:#45203B;
  --red:#FF6B70; --red-s:#46202B; --cyc:#FF73A1; --cyc-s:#48192D; --fert:#3FD1B6; --fert-s:#123A33;
  --hl:rgba(255,214,80,.30); --tape:rgba(255,143,179,.38); --tape-2:rgba(116,195,255,.36);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.7); --shadow-lg:0 28px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* Sert: a deliberate single dark world (steel, bone, flag red, brass) regardless of viewer theme */
:root[data-skin="sert"]{
  --paper:#0B0C0E; --dot:rgba(236,232,223,.045); --card:#141518; --card-2:#1B1D21; --sunk:#26282D; --line:#2B2E34;
  --ink:#EDE9E0; --ink-2:#B5B0A6; --ink-3:#7D7970;
  --acc:#E30A17; --on-acc:#FFFFFF;
  --task:#5E8DFF; --task-s:#18213A; --habit:#3DBE7A; --habit-s:#132A1F; --goal:#CBA24A; --goal-s:#2B2415;
  --rem:#F0A030; --rem-s:#2E2414; --sub:#41B8C4; --sub-s:#14292C; --event:#E0567F; --event-s:#2F1720;
  --red:#FF3B3B; --red-s:#3A1416; --cyc:#FF4D7D; --cyc-s:#3A1523; --fert:#36C9AE; --fert-s:#112C27;
  --hl:transparent; --tape:#2B2E34; --tape-2:#2B2E34;
  --shadow:0 18px 36px -24px rgba(0,0,0,.95); --shadow-lg:0 30px 60px -24px rgba(0,0,0,1);
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Saira Condensed","Arial Narrow",sans-serif;
  --r:6px;
  color-scheme:dark;
}
#app[data-accent="bayrak"]{--acc:#E30A17}
#app[data-accent="nar"]{--acc:#E23E57}
#app[data-accent="deniz"]{--acc:#2477E8}
#app[data-accent="cimen"]{--acc:#16975F}
#app[data-accent="lavanta"]{--acc:#7B5CF0}
#app[data-accent="turuncu"]{--acc:#E86A1C}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
[data-skin="sert"] body{background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px);background-size:34px 34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.t-acc{--c:var(--acc);--cs:color-mix(in srgb,var(--acc) 15%,var(--card))}
.t-task{--c:var(--task);--cs:var(--task-s)}.t-habit{--c:var(--habit);--cs:var(--habit-s)}.t-goal{--c:var(--goal);--cs:var(--goal-s)}
.t-rem{--c:var(--rem);--cs:var(--rem-s)}.t-sub{--c:var(--sub);--cs:var(--sub-s)}.t-event{--c:var(--event);--cs:var(--event-s)}.t-red{--c:var(--red);--cs:var(--red-s)}
.t-cyc{--c:var(--cyc);--cs:var(--cyc-s)}.t-fert{--c:var(--fert);--cs:var(--fert-s)}

/* Shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.spine{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:20px;padding-block:22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;font:800 26px/1 var(--f-display);letter-spacing:-.02em;padding:0 8px}
.brand-leaf{width:34px;height:38px;border-radius:7px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;font:800 17px/1 var(--f-display);color:var(--acc);position:relative;padding-top:6px;transform:rotate(-4deg);flex:none}
.brand-leaf::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;border-radius:7px 7px 0 0;background:var(--acc)}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.me b{display:block;font-weight:700}
.me small{color:var(--ink-3);font-size:12px}
.me .btn{margin-left:auto}
.avatar{--pc:var(--acc);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--pc);color:#FFFFFF;font:800 18px/1 var(--f-display);flex:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-it{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:6px 10px 6px 7px;border-radius:13px;text-align:left;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.nav-it .ic{background:transparent;color:var(--ink-3);transition:background .25s,color .25s,transform .35s var(--spring)}
.nav-it:hover{background:var(--card);color:var(--ink)}
.nav-it:hover .ic{color:var(--c);transform:rotate(-8deg) scale(1.06)}
.nav-it[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav-it[aria-current="page"] .ic{background:var(--cs);color:var(--c)}
.nav-it .n{margin-left:auto;font:700 11px/1 var(--f-body);background:var(--acc);color:var(--on-acc);border-radius:99px;padding:4px 7px;font-variant-numeric:tabular-nums}
.spine-quote{margin-top:auto;padding:14px;border-radius:16px;background:var(--card);border:1px dashed var(--line);font:600 21px/1.15 var(--f-hand);color:var(--ink-2);transform:rotate(-1.2deg)}
.spine-quote small{display:block;font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.spine-quote b{color:var(--acc)}
.spine-foot{display:flex;flex-direction:column;gap:6px}
.page{min-width:0;padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1180px;margin:0 auto;padding-inline:14px}
.mtop{display:none}
.dock,.fab{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .spine{display:none}
  .page{padding-block:8px calc(120px + env(safe-area-inset-bottom,0px))}
  .page-in{padding-inline:0}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .mtop .brand{font-size:22px;padding:0;margin-right:auto}
  .mtop .avatar{width:36px;height:36px;border:0;font-size:16px}
  .dock{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .dock-it{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font:600 9.5px/1.1 var(--f-body);color:var(--ink-3);position:relative;min-width:0;white-space:nowrap}
  .dock-it .ic{width:34px;height:28px;border-radius:10px;background:transparent;color:inherit;transition:background .25s,transform .35s var(--spring)}
  .dock-it[aria-current="page"]{color:var(--ink)}
  .dock-it[aria-current="page"] .ic{background:var(--cs);color:var(--c);transform:translateY(-2px)}
  .dock.many .dock-it .lb{display:none}
  .dock.many .dock-it{padding:7px 0}
  .dock-it .n{position:absolute;top:2px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--acc);font-size:0;padding:0}
  .fab{display:grid;place-items:center;position:fixed;z-index:31;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--acc);color:var(--on-acc);box-shadow:0 14px 30px -10px color-mix(in srgb,var(--acc) 70%,transparent);transition:transform .35s var(--spring)}
  .fab svg{width:26px;height:26px}
  .fab:active{transform:scale(.9) rotate(90deg)}
}

/* Buttons + bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:700;font-size:14px;line-height:1.1;white-space:nowrap;transition:transform .2s var(--spring),border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn svg{width:17px;height:17px}
.btn-acc{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 10px 22px -12px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn-acc:hover{border-color:var(--acc)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.icon-btn{border:1px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;padding:0;transition:transform .25s var(--spring)}
.icon-btn:hover{transform:rotate(-10deg)}
.icon-btn svg{width:19px;height:19px}
.as-link{border:0;background:transparent;padding:0;text-align:left;min-width:0}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.ic svg{width:19px;height:19px}
.tag{font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:7px;background:var(--sunk);color:var(--ink-2)}
.tag-ex{background:transparent;border:1.5px dashed var(--ink-3);color:var(--ink-3);font-family:var(--f-hand);font-size:14px;padding:1px 7px;transform:rotate(-2deg);display:inline-block;border-radius:7px;line-height:1.1}
.pill{font:700 11px/1 var(--f-body);padding:5px 8px;border-radius:99px;background:var(--cs);color:var(--c)}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 90%,transparent 90%);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.muted{color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3)}
.loading{color:var(--ink-3);font-size:13px;padding:4px 0}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--ink-3)}
.empty p{font:600 20px/1.2 var(--f-hand);color:var(--ink-2)}
.store-note{margin-top:30px;font-size:12px;color:var(--ink-3);display:flex;gap:7px;align-items:center}
.store-note i{width:8px;height:8px;border-radius:50%;background:var(--habit);display:inline-block;animation:breath 2.4s ease-in-out infinite}
.store-note.is-local i{background:var(--rem)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:background .2s,border-color .2s,transform .25s var(--spring)}
.chip:hover{transform:translateY(-1px);border-color:var(--c,var(--ink-3))}
.chip[aria-pressed="true"]{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:var(--card)}
.chip.just{animation:pop .4s var(--spring)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-h{display:flex;align-items:center;gap:11px;min-width:0}
.card-h h2{font:700 18px/1.15 var(--f-display);letter-spacing:-.01em}
.card-h .meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:13px;padding:0;align-self:flex-start;display:inline-flex;gap:6px;align-items:center}
.more span{transition:transform .25s var(--spring)}
.more:hover span{transform:translateX(4px)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line);min-width:0}
.list > .row:first-child{border-top:0}
.row-main{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.row-title{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.row-sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.row-meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.row-meta b{color:var(--ink);font-weight:700}
.done-t{color:var(--ink-3);background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/100% 1.6px}
.just-t{animation:strike .45s var(--ease)}
.due{font-weight:700;font-size:12px}
.due-late{color:var(--red)}
.due-today{color:var(--rem)}
.check{width:25px;height:25px;border-radius:50%;border:2px solid var(--c,var(--ink-3));background:transparent;display:grid;place-items:center;padding:0;color:var(--card);flex:none;transition:background .2s,transform .25s var(--spring)}
.check.box{border-radius:8px}
.check svg{width:14px;height:14px}
.check svg path{stroke-dasharray:16;stroke-dashoffset:16}
.check.is-on{background:var(--c)}
.check.is-on svg path{stroke-dashoffset:0}
.check:hover:not(.is-on):not(:disabled){background:var(--cs);transform:scale(1.08)}
.check:disabled{opacity:.35}
.check.just{animation:pop .5s var(--spring)}
.check.just.is-on svg path{animation:draw .35s .1s var(--ease) both}
.task{position:relative;padding-left:12px}
.task::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:3px;background:var(--sunk)}
.task.prio-high::before{background:var(--red)}
.task.prio-med::before{background:var(--rem)}
.bar{display:block;position:relative;height:8px;background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--sunk));border-radius:99px}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--c,var(--ink));transition:width .9s var(--ease)}
.bar > i{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.ring{display:block}
.ring-bg{fill:none;stroke:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--sunk))}
.ring-fg{fill:none;stroke:var(--c,var(--ink));stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick input,.quick select{flex:1 1 170px;min-width:0;border:1.5px solid var(--line);background:var(--card-2);border-radius:12px;padding:9px 12px;transition:border-color .2s,background .2s}
.quick input:focus,.quick select:focus{border-color:var(--acc);background:var(--card);outline:none}
.quick input[type="date"]{flex:0 1 155px}
.quick select{flex:0 1 112px}

/* Animations */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
@keyframes strike{from{background-size:0 1.6px}to{background-size:100% 1.6px}}
@keyframes breath{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12,1.18) rotate(3deg)}}
@keyframes tear{0%{transform:none}14%{transform:rotate(-3deg) translate(-2px,4px)}26%{transform:rotate(-1deg) translate(0,2px)}100%{transform:translate(-80px,115vh) rotate(-32deg);opacity:.2}}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 40%,transparent)}50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--acc) 0%,transparent)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-6deg)}60%{opacity:1;transform:scale(.96) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.enter .stag{animation:rise .55s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 45ms)}
.slide-l{animation:slideL .4s var(--ease)}
.slide-r{animation:slideR .4s var(--ease)}
.flame{color:var(--rem)}
.flame.hot{animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}

/* Gate */
.gate{position:fixed;inset:0;z-index:80;overflow-y:auto;background-color:var(--paper);background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px);background-size:34px 34px;display:flex;padding-block:calc(30px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate[hidden]{display:none!important}
.gate-in{margin:auto;width:min(620px,100%);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.gate-brand{font-size:30px}
.gate h1{font:900 clamp(34px,7vw,56px)/.95 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.gate-q{max-width:520px;font:500 italic 16px/1.4 var(--f-body);color:var(--ink-2);border-left:4px solid var(--acc);padding-left:14px;text-align:left}
.gate-q cite{display:block;margin-top:6px;font-style:normal;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
.who-card{--pc:var(--acc);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:26px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .3s var(--spring),border-color .25s;position:relative;overflow:hidden}
.who-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--pc)}
.who-card:hover:not(:disabled){transform:translateY(-5px);border-color:var(--pc)}
.who-card:disabled{opacity:.55}
.who-card .avatar{width:92px;height:92px;border-radius:12px;font-size:52px}
.who-card b{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.who-card small{display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:12.5px;font-weight:600}
.who-card small svg{width:14px;height:14px}
.gate-rem{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2);font-size:13.5px}
.gate-rem input{width:18px;height:18px;accent-color:var(--acc)}
.pin-box{display:flex;flex-direction:column;align-items:center;gap:18px}
.pin-box .avatar{width:76px;height:76px;font-size:40px;border-radius:12px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);transition:background .15s,transform .2s var(--spring)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink);transform:scale(1.1)}
.pin-dots.err{animation:shake .45s}
.pin-dots.err i{border-color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:62px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:800 26px/1 var(--f-display);transition:transform .15s var(--spring),background .15s}
.keypad button:active{transform:scale(.92);background:var(--sunk)}
.keypad .k-ghost{background:transparent;border-color:transparent;font:700 13px/1 var(--f-body);color:var(--ink-2)}
.pin-err{color:var(--red);font-weight:700;min-height:20px}

/* Page heads */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hello-date{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hello h1{font:800 clamp(30px,4.2vw,44px)/1.05 var(--f-display);letter-spacing:-.03em;margin-top:6px}
.hello h1 em{font-style:normal;color:var(--acc)}
.hello-sum{font:700 25px/1.2 var(--f-hand);color:var(--ink-2);margin-top:8px;transform:rotate(-.8deg);transform-origin:left}
.hello-right{display:flex;align-items:center;gap:14px}
.score{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 8px;box-shadow:var(--shadow)}
.score-ring{position:relative;display:block;flex:none}
.score .score-ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 17px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);text-transform:none}
.score span{font-weight:700;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;line-height:1.2}
.score span b{display:block;color:var(--ink);font:800 15px/1.1 var(--f-display);letter-spacing:0;text-transform:none}
.qhero{margin:0 0 20px;padding:20px 22px 18px 24px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:var(--r);position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.qhero::after{content:"“";position:absolute;right:14px;top:-34px;font:900 190px/1 var(--f-display);color:var(--acc);opacity:.13;pointer-events:none}
.qhero{background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 9%,var(--card)) 0%,var(--card) 55%)}
[data-skin="sert"] .qhero{background:var(--card)}
.qhero blockquote{margin:0;font:700 clamp(19px,2.4vw,27px)/1.22 var(--f-display);letter-spacing:.005em;max-width:62ch;position:relative}
.qhero figcaption{margin-top:10px;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhero figcaption span{color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:none}
.view-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.view-head .ic{width:48px;height:48px;border-radius:15px}
.view-head .ic svg{width:25px;height:25px}
.view-head h1{font:800 clamp(28px,3.6vw,38px)/1 var(--f-display);letter-spacing:-.03em}
.view-head p{font:700 20px/1.1 var(--f-hand);color:var(--ink-3);margin-top:3px}
.view-head .btn{margin-left:auto}

/* Bugün */
.today{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:22px;align-items:start}
.today-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.cols{columns:2 300px;column-gap:18px}
.cols > .card{break-inside:avoid;margin-bottom:18px}
@media (max-width:1100px){.today{grid-template-columns:minmax(0,1fr);gap:18px}.today-side{display:contents}.today .cols{order:1}.today-side > :not(:first-child){order:2}}
@media (max-width:900px){.hello .btn{display:none}}

/* Leaf */
.leaf{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 12px 12px;box-shadow:var(--shadow);text-align:center;padding:30px 18px 22px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .35s var(--spring)}
.leaf:hover{transform:rotate(-1deg) translateY(-2px)}
.leaf::before,.leaf::after{content:"";position:absolute;top:-11px;width:84px;height:26px;background-color:var(--tape);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.32) 0 6px,transparent 6px 12px);border-radius:2px}
.leaf::before{left:20px;transform:rotate(-7deg)}
.leaf::after{right:20px;transform:rotate(6deg);background-color:var(--tape-2)}
.leaf-my{display:flex;justify-content:space-between;font:800 13px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:0 6px}
.leaf-num{font:800 156px/.84 var(--f-display);letter-spacing:-.06em;color:var(--acc);margin:14px 0 6px;font-variant-numeric:tabular-nums}
.leaf.is-red .leaf-num{color:var(--red)}
.leaf-day{font:800 28px/1 var(--f-display);letter-spacing:-.01em}
.leaf-hol{display:inline-block;margin-top:10px;font-weight:700;font-size:12.5px;color:var(--red);background:var(--red-s);border-radius:99px;padding:5px 11px}
.leaf-meta{display:grid;grid-template-columns:repeat(3,1fr);margin:18px -18px 0;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line)}
.leaf-meta div{padding:11px 4px}
.leaf-meta div + div{border-left:2px dashed var(--line)}
.leaf-meta dt{font:700 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.leaf-meta dd{margin:6px 0 0;font:800 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.leaf-quote{padding-top:14px;font:700 25px/1.1 var(--f-hand);color:var(--ink-2)}
.leaf-quote small{display:block;font:700 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.leaf.tearing{position:absolute;z-index:40;margin:0;transform-origin:100% 0;animation:tear 1.15s cubic-bezier(.55,.05,.75,.3) forwards;pointer-events:none}
.leaf.tearing::before,.leaf.tearing::after{display:none}
@media (max-width:600px){.leaf{padding:26px 16px 18px}.leaf-num{font-size:112px;margin:10px 0 4px}.leaf-meta{margin:14px -16px 0}}

/* Habit hero */
.hab-hero{display:flex;align-items:center;gap:16px}
.hab-ring{position:relative;flex:none}
.hab-ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hab-ring b small{display:block;font:600 10.5px/1 var(--f-body);color:var(--ink-3);margin-top:3px}
.hab-hero p{font:700 23px/1.15 var(--f-hand);color:var(--ink-2)}
.streak{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.streak svg{width:15px;height:15px}

/* Mood */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px;min-width:0;text-align:center}
.mood svg{width:44px;height:44px;transition:transform .35s var(--spring)}
.mood .f-bg{fill:color-mix(in srgb,var(--mc) 20%,var(--card));stroke:var(--mc);stroke-width:1.4}
.mood .f-ft{fill:none;stroke:var(--mc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mood .f-eye{fill:var(--mc)}
.mood:hover svg{transform:scale(1.12) rotate(-6deg)}
.mood[aria-pressed="true"]{color:var(--ink)}
.mood[aria-pressed="true"] svg{transform:scale(1.16)}
.mood[aria-pressed="true"] .f-bg{fill:var(--mc)}
.mood[aria-pressed="true"] .f-ft{stroke:var(--card)}
.mood[aria-pressed="true"] .f-eye{fill:var(--card)}
.mood.just svg{animation:wiggle .5s ease}
.mstrip{display:flex;gap:4px;align-items:center}
.mstrip i{flex:1;height:8px;border-radius:4px;background:var(--sunk)}
.mstrip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px}

/* Cycle */
.cyc-hero{display:flex;align-items:center;gap:16px}
.cyc-ring{position:relative;flex:none}
.cyc-ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cyc-ring b small{font:600 10.5px/1 var(--f-body);color:var(--ink-3);margin-top:3px}
.cyc-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.cyc-phase{font:800 19px/1.15 var(--f-display);color:var(--cyc)}
.cyc-next{font-size:13.5px;color:var(--ink-2)}
.cyc-next b{color:var(--ink)}
.cyc-late{font-weight:700;color:var(--rem)}
.cyc-sub{font-weight:700;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.cyc-strip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.cyc-strip i{height:28px;border-radius:5px;background:var(--sunk);position:relative}
.cyc-strip i.p{background:var(--cyc)}
.cyc-strip i.f{background:var(--fert-s)}
.cyc-strip i.o{background:var(--fert)}
.cyc-strip i.now{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.cyc-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.cyc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);font-weight:600}
.cyc-legend span{display:inline-flex;align-items:center;gap:6px}
.cyc-legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.chist{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:9px 0;border-top:1px dashed var(--line)}
.list > .chist:first-child{border-top:0}
.chist b{font-weight:700;font-variant-numeric:tabular-nums}
.chist .cbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.chist .cbar i{display:block;height:100%;background:var(--cyc)}
.chist span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.disclaim{font-size:12px;color:var(--ink-3);border-left:3px solid var(--cyc);padding-left:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:18px;align-items:start}
@media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}}

/* Timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:2px}
.tl::before{content:"";position:absolute;left:60px;top:12px;bottom:12px;width:2px;background:var(--line);border-radius:2px}
.tl-it{display:grid;grid-template-columns:44px 34px minmax(0,1fr) auto;align-items:center;gap:0 4px;padding:5px 0}
.tl-time{font-weight:700;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--c);justify-self:center;position:relative;z-index:1}
.tl-body{border:0;background:var(--cs);border-radius:12px;padding:8px 11px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px;transition:transform .25s var(--spring)}
.tl-body:hover{transform:translateX(3px)}
.tl-body b{font-weight:700;font-size:14px}
.tl-body span{font-size:12px;color:var(--ink-2)}
.tl-it.is-past{opacity:.48}
.tl-it .pill{margin-left:6px}
.tl-now{display:grid;grid-template-columns:44px 34px minmax(0,1fr);align-items:center;gap:0 4px;padding:2px 0}
.tl-now .tl-time{color:var(--acc)}
.tl-now .tl-dot{border-color:var(--acc);background:var(--acc);animation:glow 2s infinite}
.tl-now hr{border:0;border-top:2px dashed var(--acc);margin:0}

/* Countdown chips */
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cdc{border-radius:14px;padding:12px;background:var(--cs);display:flex;flex-direction:column;gap:4px;border:0;text-align:left;transition:transform .25s var(--spring)}
.cdc:hover{transform:translateY(-2px) rotate(-1deg)}
.cdc b{font:800 34px/.9 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.cdc b small{font:700 12px var(--f-body);margin-left:3px}
.cdc span{font-weight:700;font-size:13px;line-height:1.25}
.cdc em{font-style:normal;font-size:11.5px;color:var(--ink-2)}

/* Payments mini */
.pays{display:flex;flex-direction:column;gap:6px}
.pay{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:4px 0;text-align:left;width:100%;border-radius:12px;transition:transform .25s var(--spring)}
.pay:hover{transform:translateX(3px)}
.pay .row-main b{font-weight:700}

/* Sub icon tile */
.sicon{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);display:grid;place-items:center;flex:none;background:var(--sc,var(--sub));color:#FFFFFF;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);overflow:hidden}
.sicon svg{width:55%;height:55%}
.sicon.has-img{background:var(--card);border:1px solid var(--line);box-shadow:none}
.sicon img{width:100%;height:100%;object-fit:contain}

/* Focus */
.pomo{display:flex;flex-direction:column;gap:14px}
.pomo-dial{position:relative;width:180px;height:180px;margin:0 auto;border-radius:50%}
.pomo-dial .ring-fg{transition:stroke-dashoffset .5s linear}
.pomo-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pomo-time{font:800 42px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pomo-mode{font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pomo.is-run .pomo-dial{animation:glow 2.4s infinite}
.pomo-ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* Stats + tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.stats div{background:var(--card-2);border-radius:13px;padding:11px 12px}
.stats dt{font-size:12px;color:var(--ink-3);font-weight:600}
.stats dd{margin:5px 0 0;font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats dd small{font:600 12px var(--f-body);color:var(--ink-3);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:0 0 20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin:0;min-width:0}
.tile dt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.tile dd{margin:8px 0 0;font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile dd small{font:600 13px var(--f-body);color:var(--ink-3);margin-left:5px;letter-spacing:0}
.tile.big{background:var(--acc);border-color:var(--acc);color:var(--on-acc);position:relative;overflow:hidden}
.tile.big::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.tile.big dt,.tile.big dd small{color:color-mix(in srgb,var(--on-acc) 80%,transparent)}
.tile.cy{background:var(--cyc);border-color:var(--cyc);color:var(--card)}
.tile.cy dt,.tile.cy dd small{color:color-mix(in srgb,var(--card) 82%,transparent)}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.badges.wide{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-2);line-height:1.15}
.badge i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--card);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--cs);transition:transform .35s var(--spring)}
.badge i svg{width:22px;height:22px}
.badge:hover i{transform:rotate(-12deg) scale(1.08)}
.badge.locked{color:var(--ink-3)}
.badge.locked i{background:var(--sunk);color:var(--ink-3);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sunk)}

/* Note */

/* Calendar */

.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:112px;padding:7px 7px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .25s var(--spring),box-shadow .25s,border-color .2s}

}

.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

const FLOWS = [[0,'Yok'],[1,'Hafif'],[2,'Orta'],[3,'Yoğun']];

function cycleData() {
  const st = settings(), t = today(), tk = key(t);
  const ks = Object.keys(S.days).filter(isPer).sort();
  const starts = ks.filter(k => { const d = parse(k); return !isPer(key(addDays(d, -1))) && !isPer(key(addDays(d, -2))); });
  const cycles = starts.map((s, i) => {

    const nx = starts[i + 1]; return { start: s, perLen: len, cycLen: nx ? diff(s0, parse(nx)) : null };
  });

  const avgCycle = valid.length ? Math.round(valid.reduce((a, c) => a + c.cycLen, 0) / valid.length) : Math.max(15, Math.min(60, +st.cycleLen || 28));
  const pl = cycles.filter(c => c.perLen > 0).slice(-6);
  const avgPer = pl.length ? Math.round(pl.reduce((a, c) => a + c.perLen, 0) / pl.length) : Math.max(1, Math.min(12, +st.perLen || 5));
  const past = starts.filter(s => s <= tk), last = past.length ? past[past.length - 1] : null;
  const info = { cycles, starts, avgCycle, avgPer, last, fromData: valid.length > 0 };
  if (last) {

    info.nextStart = addDays(ls, avgCycle);
    info.late = diff(info.nextStart, t);

}

}

const fx = $('#fx'), fctx = fx.getContext('2d');

    case 'switch': switchProfile(); break;
    case 'install': if (installEvt) { const ev = installEvt; ev.prompt(); ev.userChoice.finally(() => { installEvt = null; renderGate(); if (dlgState && dlgState.kind === 'settings') openSettings(); }); } break;
    case 'notif': if ('Notification' in window) Notification.requestPermission().then(p => { openSettings(); toast(p === 'granted' ? 'Bildirimler açıldı.' : 'Bildirim izni verilmedi.'); }); break;
    case 'tab': setTab(ds.tab); break;
    case 'add': openForm(ds.kind || TAB_KIND[tab], null, ds.date ? { date: ds.date } : {}); break;
    case 'edit': openForm(ds.kind, ds.id); break;
    case 'hab': toggleHabit(ds.id, ds.date, rect); break;
    case 'task': { const t = S.tasks[ds.id]; if (!t) break; just = 'task:' + ds.id; put('tasks', ds.id, { ...t, done: !t.done, doneAt: !t.done ? key(today()) : '' }); if (!t.done) { burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 20, .9); checkBadges(); } break; }
    case 'step': { const g = S.goals[ds.gid]; if (!g) break; const was = goalProgress(g); const ng = { ...g, steps: (g.steps || []).map(s => s.id === ds.sid ? { ...s, done: !s.done } : s) }; just = `step:${ds.gid}:${ds.sid}`; put('goals', ds.gid, ng); const now = goalProgress(ng); if (now > was) burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 16, .8); if (now >= 100 && was < 100) { setTimeout(bigConfetti, 200); toast(g.title, { label: C().goalDone }); checkBadges(); } break; }
    case 'rem-done': { const r = S.reminders[ds.id]; if (r) { just = 'rem:' + ds.id; put('reminders', ds.id, { ...r, done: !r.done }); } break; }
    case 'sub-toggle': { const s = S.subs[ds.id]; if (s) put('subs', ds.id, { ...s, active: s.active === false }); break; }
    case 'mood': { const k = ds.date, v = +ds.v, day = dayStrip(k), same = +day.mood === v; just = 'mood:' + v; put('days', k, { ...day, mood: same ? 0 : v }); if (v >= 4 && !same) burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 14, .7); break; }
    case 'per-set': { const k = ds.date, v = +ds.v, day = dayStrip(k); if (parse(k) > today()) break; just = `per:${k}:${v}`; const nd = { ...day, per: (+day.per === v) ? 0 : v }; put('days', k, nd); break; }
    case 'sym': { const k = ds.date, s = ds.s, day = dayStrip(k); if (parse(k) > today()) break; const set = new Set(day.sym || []); if (set.has(s)) set.delete(s); else set.add(s); just = `sym:${k}:${s}`; put('days', k, { ...day, sym: [...set] }); break; }
    case 'tear': tearLeaf(); break;
    case 'next-quote': quoteOff++; render(); break;
    case 'cal-mode': calMode = ds.m === 'hafta' ? 'hafta' : 'ay'; lsSet('gunce.calMode', calMode); render({ enter: true }); break;
    case 'cal-prev': case 'cal-next': {
      const dir = ds.act === 'cal-prev' ? -1 : 1; calDir = dir;
      if (calMode === 'ay') { calM += dir; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } }
      else { const d = addDays(parse(calSel), 7 * dir); calSel = key(d); calY = d.getFullYear(); calM = d.getMonth(); }
      render(); break;
    }
    case 'cal-today': { const t = today(); calDir = 0; calY = t.getFullYear(); calM = t.getMonth(); calSel = key(t); render(); break; }
    case 'cal-day': { calSel = ds.date; const d = parse(ds.date); if (d.getMonth() !== calM || d.getFullYear() !== calY) { calDir = d < new Date(calY, calM, 1) ? -1 : 1; calM = d.getMonth(); calY = d.getFullYear(); } render(); if (window.innerWidth <= 1100) { const p = $('#dayPanel'); if (p) p.scrollIntoView({ block: 'start', behavior: reduceMotion.matches ? 'auto' : 'smooth' }); } break; }
    case 'tf': taskF = ds.f; render(); break;
    case 'pomo-toggle': pomoToggle(); break;
    case 'pomo-reset': pomoReset(); break;
    case 'pomo-len': pomo.len = pomo.len === 25 ? 50 : 25; pomo.brk = pomo.len === 50 ? 10 : 5; if (!pomo.run) { pomo.mode = 'focus'; pomo.left = pomo.len * 60; } render(); break;
    case 'settings': openSettings(); break;
    case 'skin': putSettings({ skin: ds.s === 'sert' ? 'sert' : 'yumusak', accent: ds.s === 'sert' ? 'bayrak' : (settings().accent === 'bayrak' ? 'nar' : settings().accent) }); openSettings(); burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 18, .8); break;
    case 'accent': putSettings({ accent: ds.k }); dlgBody.querySelectorAll('[data-act="accent"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === ds.k))); burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 14, .7); break;
    case 'pin-set': { const inp = $('#set-pin'), v = inp ? inp.value.trim() : ''; if (!/^\d{4}$/.test(v)) { toast('PIN 4 rakamdan oluşmalı.'); break; } const pid = prof.id; hashPin(pid, v).then(h => { if (!prof || prof.id !== pid) return; putSettings({ pinHash: h }); unlocked.add(pid); saveUnlocked(); openSettings(); toast('PIN kaydedildi. Bir sonraki girişte sorulacak.'); }); break; }
    case 'pin-clear': putSettings({ pinHash: '' }); openSettings(); toast('PIN kaldırıldı.'); break;
    case 'dlg-close': closeDlg(); break;
    case 'dlg-del': deleteCurrent(); break;
    case 'dlg-kind': { const f = dlgBody.querySelector('form'); const title = f ? String(new FormData(f).get('title') || '') : ''; openForm(ds.kind, null, { title, date: dlgState && dlgState.date }); break; }
    case 'logo-clear': if (dlgState) { dlgState.logo = null; a.remove(); lookPreview(); } break;
    case 'export': exportData(); break;
    case 'clear-ex': clearExamples(a); break;
  }
});
document.addEventListener('keydown', e => {
  if (!gate.open || gate.mode !== 'pin') return;
  if (/^\d$/.test(e.key)) { e.preventDefault(); pinKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); pinKey('del'); }
  else if (e.key === 'Escape') { gate.mode = 'pick'; gate.pin = ''; renderGate(); }
});
document.addEventListener('change', e => { if (e.target && e.target.id === 'gateRemember') remember = e.target.checked; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
dlg.addEventListener('close', () => { dlgState = null; });
dlgBody.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'icon' || t.name === 'color') lookPreview();
  if (t.id === 'logoFile' && t.files && t.files[0]) { try { const data = await readLogo(t.files[0]); if (dlgState) { dlgState.logo = data; lookPreview(); toast('Resim eklendi. Kaydetmeyi unutma.'); } } catch (err) { toast('Bu resim okunamadı. PNG, JPG ya da WEBP dene.'); } t.value = ''; }
  if (t.id === 'importFile' && t.files && t.files[0]) importData(t.files[0]);
});
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset && f.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (kind === 'item') saveForm(f);
  else if (kind === 'quick-task') {
    const title = String(fd.get('title') || '').trim(); if (!title) return;
    put('tasks', uid(), { title, due: f.dataset.due || String(fd.get('due') || ''), prio: String(fd.get('prio') || 'med'), cat: '', note: '', done: false, created: key(today()) }, { quiet: true });
    const inp = f.querySelector('input[name=title]'); if (inp) inp.value = '';
    render(); toast(C().taskAdded);
  } else if (kind === 'step') {
    const t = String(fd.get('t') || '').trim(), g = S.goals[f.dataset.gid]; if (!t || !g) return;
    const inp = f.querySelector('input[name=t]'); if (inp) inp.value = '';
    put('goals', f.dataset.gid, { ...g, steps: [...(g.steps || []), { id: uid(), t, done: false }] });
  } else if (kind === 'settings') {
    const usd = parseFloat(String(fd.get('usd')).replace(',', '.')), eur = parseFloat(String(fd.get('eur')).replace(',', '.'));
    if (!(usd > 0) || !(eur > 0)) { toast('Kurlar sıfırdan büyük bir sayı olmalı.'); return; }
    const name = String(fd.get('name') || '').trim().slice(0, 40) || profDef(prof.id).name;
    putSettings({ usd, eur, name, cycle: fd.get('cycle') === 'on', ratesDate: key(today()) }); closeDlg(); toast('Ayarlar kaydedildi.');
  } else if (kind === 'cycle-def') {
    const cl = Math.round(+fd.get('cycleLen')), pl = Math.round(+fd.get('perLen'));
    if (!(cl >= 15 && cl <= 60) || !(pl >= 1 && pl <= 12)) { toast('Döngü 15–60, regl süresi 1–12 gün arasında olmalı.'); return; }
    putSettings({ cycleLen: cl, perLen: pl }); toast('Varsayılanlar kaydedildi.');
  }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.matches || !el.matches('textarea[data-note]')) return;
  const k = el.dataset.note; noteDraft[k] = el.value; clearTimeout(noteT);
  noteT = setTimeout(() => { noteT = null; const day = dayStrip(k); if ((day.note || '') !== noteDraft[k]) put('days', k, { ...day, note: noteDraft[k] }, { quiet: true }); delete noteDraft[k]; }, 700);
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (gate.open) renderGate(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Günce telefonuna eklendi.'); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h]) setTab(h); });
window.addEventListener('resize', () => { if (fxRun) fxSize(); });
let lastDay = key(today());
setInterval(() => { checkAlerts(); const k = key(today()); if (k !== lastDay) { lastDay = k; calSel = k; } if (!dlg.open && prof) schedRender(); }, 30000);

$('#spineAdd').innerHTML = `${svg('plus')}Yeni kayıt`;
$('#spineSet').innerHTML = `${svg('gear')}Ayarlar`;
$('#mSet').innerHTML = svg('gear');
$('#fab').innerHTML = svg('plus');
init();
})();
</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
